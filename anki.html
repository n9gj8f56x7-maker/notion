<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anki Habit</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #191919;
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      width: min(90vw, 320px);
      border-radius: 12px;
      border: 1px solid #32323a;
      box-shadow: 0 1px 5px 2px rgba(0,0,0,0.12), 0 1px 2px 1px rgba(0,0,0,0.12);
      background: #ffD6F3;
      color: #333333;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow: hidden;
    }

    .card-header {
      padding: 16px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title {
      font-size: 16px;
      font-weight: 500;
      color: #333333;
    }

    .progress {
      font-size: 20px;
      font-weight: 300;
      color: #333333;
      line-height: 28px;
    }

    .card-content {
      padding: 0 16px 16px 16px;
      display: flex;
      justify-content: space-between;
    }

    .day-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .day-label {
      font-size: 13px;
      font-weight: 500;
      color: #6B7280;
    }

    .day-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      color: #6B7280;
      border: 2px solid transparent;
    }

    .day-circle.today {
      border-color: #ad9dff;
    }

    .day-circle.completed {
      background: #ad9dff;
      border-color: #ad9dff;
    }

    .day-circle.completed svg {
      width: 14px;
      height: 14px;
    }

    .card-footer {
      padding: 0 16px 16px 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .streak {
      font-size: 14px;
      font-weight: 500;
      color: #333333;
      opacity: 0.6;
      line-height: 20px;
    }

    .streak-num {
      font-weight: 500;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 36px;
    }

    .reset-btn {
      background: #ffffff;
      color: #4b5563;
      border: 2px solid #ad9dff;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 20px;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .reset-btn:hover { opacity: 0.85; }

    .complete-btn {
      flex-shrink: 0;
      background: #ad9dff;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 20px;
      white-space: nowrap;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .complete-btn:hover:not(.done) { opacity: 0.85; }

    .complete-btn.done {
      background: #dcfce7;
      color: #4b5563;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="title-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle">
          <path d="M12 13V2l8 4-8 4"/>
          <path d="M20.561 10.222a9 9 0 1 1-12.55-5.29"/>
          <path d="M8.002 9.997a5 5 0 1 0 8.9 2.02"/>
        </svg>
        <span class="title">Anki</span>
      </div>
      <span class="progress" id="progress">0/7</span>
    </div>

    <div class="card-content" id="daysGrid"></div>

    <div class="card-footer">
      <div class="streak">Streak: <span class="streak-num" id="streakCount">0</span></div>
      <div class="buttons">
        <button class="reset-btn" id="resetBtn">Reset</button>
        <button class="complete-btn" id="completeBtn">Complete Today</button>
      </div>
    </div>
  </div>

  <script>
    const DAY_LABELS = ['M','T','W','T','F','S','S'];
    const STORE_KEY = 'anki-habit-v1';

    function getWeekDates() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const dow = today.getDay();
      const monday = new Date(today);
      monday.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1));
      return Array.from({ length: 7 }, (_, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        return d;
      });
    }

    function dateKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function load() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }
      catch { return {}; }
    }

    function save(s) { localStorage.setItem(STORE_KEY, JSON.stringify(s)); }

    const weekDates = getWeekDates();
    const todayKey = dateKey(new Date());
    let state = load();
    if (!Array.isArray(state.completed)) state.completed = [];

    function calcStreak() {
      const set = new Set(state.completed);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let d = new Date(today);
      if (!set.has(dateKey(d))) d.setDate(d.getDate() - 1);
      let count = 0;
      while (set.has(dateKey(d))) {
        count++;
        d.setDate(d.getDate() - 1);
      }
      return count;
    }

    function render() {
      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';

      weekDates.forEach((date, i) => {
        const key = dateKey(date);
        const isToday = key === todayKey;
        const isDone = state.completed.includes(key);

        const col = document.createElement('div');
        col.className = 'day-col';

        const label = document.createElement('div');
        label.className = 'day-label';
        label.textContent = DAY_LABELS[i];

        const circle = document.createElement('div');
        circle.className = 'day-circle' + (isToday ? ' today' : '') + (isDone ? ' completed' : '');

        if (isDone) {
          circle.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
        } else {
          circle.textContent = date.getDate();
        }

        col.appendChild(label);
        col.appendChild(circle);
        grid.appendChild(col);
      });

      const doneCount = weekDates.filter(d => state.completed.includes(dateKey(d))).length;
      document.getElementById('progress').textContent = `${doneCount}/7`;
      document.getElementById('streakCount').textContent = calcStreak();

      const btn = document.getElementById('completeBtn');
      const todayDone = state.completed.includes(todayKey);
      btn.textContent = todayDone ? 'Completed' : 'Complete Today';
      btn.className = 'complete-btn' + (todayDone ? ' done' : '');
    }

    document.getElementById('completeBtn').addEventListener('click', () => {
      if (state.completed.includes(todayKey)) return;
      state.completed.push(todayKey);
      save(state);
      render();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      const weekKeys = new Set(weekDates.map(dateKey));
      state.completed = state.completed.filter(k => !weekKeys.has(k));
      save(state);
      render();
    });

    render();
  </script>
</body>
</html>
