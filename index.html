<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: #9AA6EE;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
    }

    .card {
      background: #9AA6EE;
      padding: clamp(20px, 5vw, 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(16px, 3vw, 28px);
      width: 100%;
    }

    .modes {
      display: flex;
      gap: clamp(6px, 1.5vw, 12px);
      flex-wrap: wrap;
      justify-content: center;
    }

    .mode-btn {
      background: #ffD6F3;
      border: none;
      border-radius: 8px;
      padding: clamp(6px, 1.2vw, 10px) clamp(12px, 2.5vw, 22px);
      font-size: clamp(10px, 1.5vw, 13px);
      font-family: monospace;
      color: #2d2d2d;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .mode-btn:hover {
      background: #f0a0d6;
    }

    .mode-btn.active {
      background: #FFB3E9;
      outline: 2px solid rgba(255,255,255,0.5);
    }

    .time-display {
      font-size: clamp(60px, 18vw, 120px);
      color: #ffffff;
      line-height: 1;
      font-family: 'Lexend', sans-serif;
      font-weight: 300;
    }

    .controls {
      display: flex;
      gap: clamp(8px, 2vw, 14px);
      align-items: center;
    }

    .start-btn {
      background: #ffD6F3;
      border: none;
      border-radius: 10px;
      padding: clamp(10px, 2vw, 14px) clamp(24px, 5vw, 40px);
      font-size: clamp(13px, 2vw, 16px);
      font-family: monospace;
      color: #2d2d2d;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .start-btn:hover {
      background: #f0a0d6;
    }

    .start-btn svg {
      width: clamp(14px, 2vw, 18px);
      height: clamp(14px, 2vw, 18px);
      flex-shrink: 0;
    }

    .reset-btn {
      background: #ffD6F3;
      border: none;
      border-radius: 10px;
      width: clamp(38px, 7vw, 50px);
      height: clamp(38px, 7vw, 50px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .reset-btn:hover {
      background: #f0a0d6;
    }

    .reset-btn svg {
      width: clamp(16px, 2.5vw, 22px);
      height: clamp(16px, 2.5vw, 22px);
      color: #2d2d2d;
    }
  </style>
</head>
<body>
