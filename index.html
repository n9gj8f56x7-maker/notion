<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: #191919;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
    }

    .card {
      background: #9AA6EE;
      border-radius: 16px;
      padding: clamp(20px, 5vw, 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(16px, 3vw, 28px);
      width: min(90vw, 480px);
    }

    .modes {
      display: flex;
      gap: clamp(6px, 1.5vw, 12px);
      flex-wrap: wrap;
      justify-content: center;
    }

    .mode-btn {
      background: #ffD6F3;
      border: none;
      border-radius: 8px;
      padding: clamp(6px, 1.2vw, 10px) clamp(12px, 2.5vw, 22px);
      font-size: clamp(10px, 1.5vw, 13px);
      font-family: monospace;
      color: #2d2d2d;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .mode-btn:hover {
      background: #f0a0d6;
    }

    .mode-btn.active {
      background: #FFB3E9;
      outline: 2px solid rgba(255,255,255,0.5);
    }

    .time-display {
      font-size: clamp(60px, 18vw, 120px);
      color: #ffffff;
      line-height: 1;
      font-family: 'Lexend', sans-serif;
      font-weight: 300;
    }

    .controls {
      display: flex;
      gap: clamp(8px, 2vw, 14px);
      align-items: center;
    }

    .start-btn {
      background: #ffD6F3;
      border: none;
      border-radius: 10px;
      padding: clamp(10px, 2vw, 14px) clamp(24px, 5vw, 40px);
      font-size: clamp(13px, 2vw, 16px);
      font-family: monospace;
      color: #2d2d2d;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .start-btn:hover {
      background: #f0a0d6;
    }

    .start-btn svg {
      width: clamp(14px, 2vw, 18px);
      height: clamp(14px, 2vw, 18px);
      flex-shrink: 0;
    }

    .reset-btn {
      background: #ffD6F3;
      border: none;
      border-radius: 10px;
      width: clamp(38px, 7vw, 50px);
      height: clamp(38px, 7vw, 50px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .reset-btn:hover {
      background: #f0a0d6;
    }

    .reset-btn svg {
      width: clamp(16px, 2.5vw, 22px);
      height: clamp(16px, 2.5vw, 22px);
      color: #2d2d2d;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="modes">
      <button class="mode-btn active" data-mode="pomodoro"></button>
      <button class="mode-btn" data-mode="short"></button>
      <button class="mode-btn" data-mode="long"></button>
    </div>

    <div class="time-display" id="display"></div>

    <div class="controls">
      <button class="start-btn" id="startBtn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
        <span id="startLabel"></span>
      </button>
      <button class="reset-btn" id="resetBtn" title="Reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    function mono(str) {
      return [...str.toUpperCase()].map(c => {
        const code = c.charCodeAt(0);
        if (code >= 65 && code <= 90) return String.fromCodePoint(0x1D670 + code - 65);
        if (code >= 48 && code <= 57) return String.fromCodePoint(0x1D7F6 + code - 48);
        return c;
      }).join('');
    }

    const LABELS = { pomodoro: 'Pomodoro', short: 'Short Break', long: 'Long Break' };
    const DURATIONS = { pomodoro: 45 * 60, short: 10 * 60, long: 20 * 60 };

    let mode = 'pomodoro';
    let remaining = DURATIONS[mode];
    let running = false;
    let interval = null;

    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const startLabel = document.getElementById('startLabel');
    const resetBtn = document.getElementById('resetBtn');
    const modeButtons = document.querySelectorAll('.mode-btn');

    modeButtons.forEach(btn => { btn.textContent = mono(LABELS[btn.dataset.mode]); });

    function fmt(s) {
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = (s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    function updateStartIcon() {
      const svg = startBtn.querySelector('svg');
      if (running) {
        svg.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
      } else {
        svg.innerHTML = '<polygon points="5,3 19,12 5,21"/>';
      }
    }

    function render() {
      display.textContent = fmt(remaining);
      startLabel.textContent = mono(running ? 'Pause' : 'Start');
      updateStartIcon();
    }

    function tick() {
      if (remaining <= 0) { clearInterval(interval); running = false; render(); return; }
      remaining--;
      render();
    }

    startBtn.addEventListener('click', () => {
      if (running) { clearInterval(interval); running = false; }
      else { interval = setInterval(tick, 1000); running = true; }
      render();
    });

    resetBtn.addEventListener('click', () => {
      clearInterval(interval); running = false; remaining = DURATIONS[mode]; render();
    });

    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        modeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
        clearInterval(interval); running = false; remaining = DURATIONS[mode]; render();
      });
    });

    render();
  </script>
</body>
</html>
